[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-hygiene"
dynamic = ["version"]
description = "pre-commit hooks that keep engagement identifiers out of repositories"
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
authors = [{name = "Philip Dye", email = "phdye@acm.org"}]
requires-python = ">=3.6.8"
# Floor is RHEL 8.10's shipped python3 (3.6.8), not a stylistic choice.
# These hooks have to run on the machines they protect, and that
# includes RHEL 8.10 targets with nothing newer installed. Verified
# live against Cygwin's RHEL-8.10 emulation (python 3.6.9): no
# `from __future__ import annotations`, no PEP 604/585 generics at
# runtime (typing.List/Optional/Pattern instead), no capture_output=
# (3.7+) on subprocess.run. See a/doc/instructions.md.
#
# No runtime dependencies, deliberately. A pre-commit hook that pulls a
# dependency tree is a hook that breaks in someone else's environment.
dependencies = []

[project.scripts]
check-identifiers = "git_hygiene.check_identifiers:main"
audit-tree = "git_hygiene.audit_tree:main"
install-hooks = "git_hygiene.install_hooks:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/git_hygiene/_version.py"

[tool.ruff]
line-length = 100
# py37 is ruff's oldest available target-version; there is no py36.
# The real floor is 3.6.8 (see requires-python above), so this is a
# ceiling on what ruff can express, not the actual minimum. UP022 on
# terms.git() is suppressed for the one line that gap affects.
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the point of a test. S603/S607: the tests drive real
# git repositories on purpose, and git is resolved from PATH the same
# way every other git tooling resolves it.
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
# 3.10, not the project's real 3.6.8 floor - mypy 2.x refuses any
# python_version below 3.10 outright ("Python 3.6 is not supported").
# This checks the code's shape, not its actual runtime compatibility;
# the 3.6.9 emulation (a/probe scripts, run and discarded) is what
# proves the floor, not mypy.
python_version = "3.10"
# Target platform pinned for the same reason python_version is: check
# the code against where it DEPLOYS, not against whichever machine
# happens to run mypy. This package's dev tooling runs under Windows
# Python here (mypy 2.x refuses python_version below 3.10, so it cannot
# run at the real 3.6.8 floor), while CI runs it on ubuntu-latest.
# Without this, POSIX-only calls like os.getuid error under a
# Windows-run mypy but not a Linux-run one, and any `type: ignore`
# added to satisfy one becomes an unused-ignore error under the other.
platform = "linux"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
markers = [
    "packaging: exercises pre-commit's own hook installation (slow)",
]
addopts = "-m 'not packaging'"

[tool.coverage.run]
source = ["src/git_hygiene"]

[tool.coverage.report]
fail_under = 85
show_missing = true
