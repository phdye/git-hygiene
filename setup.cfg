[metadata]
name = git-hygiene
description = pre-commit hooks that keep engagement identifiers out of repositories
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT OR Apache-2.0
author = Philip Dye
author_email = phdye@acm.org

[options]
package_dir =
    = src
packages = find:
# The floor is RHEL 8.10's shipped python3, not a stylistic choice: these
# hooks have to run on the machines they protect (decision 0007).
python_requires = >=3.6.8
# No runtime dependencies, deliberately. A hook that pulls in a dependency
# tree is a hook that breaks in someone else's environment.
install_requires =

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    check-identifiers = git_hygiene.check_identifiers:main
    audit-tree = git_hygiene.audit_tree:main
    install-hooks = git_hygiene.install_hooks:main
    normalize-file-modes = git_hygiene.filemode:main

[options.extras_require]
dev =
    pytest>=8.0.0
    pytest-cov>=5.0.0
    mypy>=1.9.0
    ruff>=0.4.0
    pre-commit>=3.7.0
    # tests/test_sdist.py builds a source distribution in-process.
    setuptools
    setuptools_scm
